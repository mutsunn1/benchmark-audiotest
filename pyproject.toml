[project]
name = "captbench"
version = "0.1.0"
description = "Benchmark harness: traditional CAPT (acoustic-phonetic) scoring vs Qwen-Omni scoring for Mandarin pronunciation assessment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pypinyin>=0.51",
    "praat-parselmouth>=0.4.3",
    "httpx>=0.27",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
captbench = "captbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
